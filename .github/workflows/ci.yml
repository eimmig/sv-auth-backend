name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Changelog - ver docs/CI-CD.md (vault local, nao versionado neste repo)
      - name: Validar atualizacao do CHANGELOG.md
        # Todo PR valida, inclusive subtask -> branch da story: cada subtarefa adiciona a
        # propria linha em [Unreleased], que se acumula ate o merge em develop.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/validate-changelog.sh CHANGELOG.md

      # 2. Chaves de traducao - ver docs/CONVENTIONS.md secao "Internacionalizacao (i18n)"
      - name: Validar chaves de traducao (pt-BR/en-US/es)
        # Guarda por arquivo-marcador PROPRIO deste passo (nao o pom.xml dos demais): feat-001
        # deste servico foi dividida em subtasks incrementais (ver plan_review), entao pom.xml
        # existe varias subtasks antes das mensagens de i18n (feat-001.5) - com o guard geral
        # de pom.xml, os PRs intermediarios quebrariam so por sequenciamento, sem defeito real.
        # Liga sozinho quando messages_pt_BR.properties passar a existir.
        if: hashFiles('src/main/resources/messages_pt_BR.properties') != ''
        run: |
          python3 .github/scripts/validate-i18n-keys.py --format properties \
            --file pt-BR=src/main/resources/messages_pt_BR.properties \
            --file en-US=src/main/resources/messages_en_US.properties \
            --file es=src/main/resources/messages_es.properties

      - uses: actions/setup-java@v4
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Liga sozinho no feat-001 deste
        # servico, quando o marcador passa a existir. Ver docs/CI-CD.md.
        if: hashFiles('pom.xml') != ''
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # 3. Build
      - name: Build
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Liga sozinho no feat-001 deste
        # servico, quando o marcador passa a existir. Ver docs/CI-CD.md.
        if: hashFiles('pom.xml') != ''
        run: mvn -B -DskipTests package

      # 4. Testes unitarios + cobertura
      - name: Testes unitarios e cobertura
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Liga sozinho no feat-001 deste
        # servico, quando o marcador passa a existir. Ver docs/CI-CD.md.
        if: hashFiles('pom.xml') != ''
        run: mvn -B test jacoco:report

      # 5. Qualidade de codigo e cobertura (SonarCloud)
      - name: SonarCloud
        # Pulado em PR de subtask: cobertura parcial de uma feature em andamento
        # reprovaria o quality gate sem indicar defeito real.
        # Guarda por arquivo-marcador: enquanto o projeto nao existe (repositorio so com
        # harness), este passo e pulado em vez de falhar. Liga sozinho no feat-001 deste
        # servico, quando o marcador passa a existir. Ver docs/CI-CD.md.
        if: hashFiles('pom.xml') != '' && (github.event_name != 'pull_request' || github.base_ref == 'develop' || github.base_ref == 'main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B sonar:sonar
          -Dsonar.projectKey=eimmig_sv-auth-backend
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.host.url=https://sonarcloud.io
