# Exigido pela condicao de ativacao do MessageSourceAutoConfiguration do Spring Boot (checa
# classpath*:messages.properties, sem sufixo de locale) - sem este arquivo o bean MessageSource
# real nunca e criado e todo getMessage(...) real da aplicacao lanca NoSuchMessageException via
# DelegatingMessageSource, mesmo com messages_pt_BR/en_US/es.properties presentes e corretos.
# Nao e um 4o locale: as chaves reais vivem so nos 3 arquivos com sufixo de locale.
