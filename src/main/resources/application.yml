spring:
  application:
    name: auth-service
  # Migracao lazy por schema (feat-001.3 le X-Tenant-Id), nao lista fixa no boot.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  messages:
    fallback-to-system-locale: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
      show-details: always

logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth}
    username: ${DB_USER:auth_user}
    password: ${DB_PASSWORD}

admin:
  api-key: ${ADMIN_API_KEY}

---
spring:
  config:
    activate:
      on-profile: test
  # Datasource vem do Testcontainers (@ServiceConnection) em runtime.

admin:
  api-key: test-admin-api-key

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

admin:
  api-key: ${ADMIN_API_KEY}
